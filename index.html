<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStore | متجرك الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f7fafc; margin: 0; padding: 20px; text-align: center; color: #2d3748; }
        .container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #00b4d8; }
        .btn { background: #00b4d8; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 15px; }
        .btn:hover { background: #0077b6; }
        .payment { margin-top: 25px; border-top: 1px solid #edf2f7; padding-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚡ SmartStore جاهز يا بطل!</h1>
        <p>مرحباً بك في متجرك الإلكتروني للأجهزة الذكية وأليكسا.</p>
        
        <div style="background:#e0f7fa; padding:15px; border-radius:8px; margin:20px 0;">
            <h3>🛒 عربة المشتريات (تفاعلية)</h3>
            <p>اضغط على الزرار بالأسفل لتجربة إضافة منتج.</p>
            <button class="btn" onclick="alert('تم إضافة جهاز أليكسا إلى السلة بنجاح!')">إضافة أليكسا للسلة</button>
        </div>

        <div class="payment">
            <h4>💳 طرق الدفع المدعومة:</h4>
            <p>PayPal | Visa | Mastercard</p>
            <button class="btn" style="background:#ffc439; color:#003087; margin-right:5px;" onclick="alert('جاري التوجيه إلى PayPal...')">الدفع بواسطة PayPal</button>
            <button class="btn" style="background:#2d3748;" onclick="alert('جاري التوجيه إلى بوابة الفيزا...')">الدفع بالبطاقة الذكية</button>
        </div>
    </div>

</body>
</html>
